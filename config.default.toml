# Wallflex settings. Changes apply about a second after you save.
#
# Sizes and offsets are in units of 0.1% of the monitor's height, so a
# layout looks the same on any resolution: 64 units is about 69 pixels
# on a 1080p monitor and 138 on a 4K one.

# What's behind the widgets: a colour as "#RRGGBB", or "transparent" to
# let the Windows wallpaper show through around them.
background = "#000000"

# A picture to show behind the widgets on every monitor (a layout can
# pick its own, or image = "" for none). JPEG, PNG, BMP, GIF or TIFF.
# Use single quotes so backslashes stay as they are; a path without a
# drive letter is looked for next to this file. image_fit is "fill"
# (covers the monitor, cropping), "fit" (the whole picture, with bars
# of background), "stretch", "center" (actual size) or "span" (one
# picture across every monitor using it, drawn the same physical size
# on each, so it carries on across the gap between screens).
#
# image = 'C:\Users\you\Pictures\wallpaper.jpg'
# image_fit = "fill"

# "smooth": glides and the visualizer at up to 60 frames a second until
# the PC is 80% busy, then light. "light": no glides, readings once a
# second, a slower visualizer; as light as it gets. In light, monitors
# hidden by a full-screen window stop drawing, and with every widget
# hidden Wallflex sleeps until one shows again. Either way Wallflex
# keeps itself under 2% CPU and 120 MB of memory.
performance = "smooth"

# One [[layout]] per monitor setup. Each monitor uses the first layout
# whose "monitor" matches it:
#   "*"          every monitor
#   "primary"    the main monitor
#   "3440x1440"  any monitor with that resolution
#   "DISPLAY2"   a monitor by its Windows name (wallflex --diagnose
#                lists them)
# A monitor that matches no layout just shows the background.
[[layout]]
monitor = "*"
# Scales everything in this layout; 1.5 is half as big again.
size = 1.0

# Each [[layout.widget]] places one widget. "kind" is one of:
#   "panel"    everything below in one block, as one widget
#   "cpu"      CPU thread columns
#   "network"  the last minute of download and upload
#   "gpus"     every GPU's rings, two per row
#   "gpu"      one GPU's rings: add gpu = 1 (or 2, ...)
#   "info"     RAM use and SSD temperatures
#   "discord"  your call, notifications and more (needs [discord] below)
#   "visualizer"  bars for the music playing, with what's playing (title,
#                 artist, album art) under them; only draws while sound
#                 plays, and rests while a full-screen window covers it
# "anchor" is the corner or edge it sits against: top-left, top,
# top-right, left, center, right, bottom-left, bottom or bottom-right.
# Positions are measured from the edges of the area the taskbar leaves
# free. x and y move the widget in from its edges (64 if left out);
# along a centred axis they move it right or down (0 if left out).
[[layout.widget]]
kind = "panel"
anchor = "bottom-right"
x = 64
y = 64

# A layout can also set its own background, image and image_fit, which
# beat the ones at the top for the monitors it's used on, and line up
# its monitor's picture: image_zoom draws it bigger or smaller (for a
# span it's worked out from the monitors' sizes if left out) and
# image_offset = [x, y] moves it, in pixels, right and down. Use them
# to make a spanned picture meet exactly across the bezels.
#
# Example: different widgets and pictures on two monitors. Put layouts
# like these above the "*" one (or delete it), since the first match
# wins.
#
# [[layout]]
# monitor = "3440x1440"
# image = 'C:\Users\you\Pictures\wide.jpg'
# image_zoom = 1.1
# image_offset = [0, -20]
#
# [[layout.widget]]
# kind = "panel"
# anchor = "bottom-right"
# x = 64
# y = 64
#
# [[layout]]
# monitor = "primary"
# background = "transparent"
# image = ""
#
# [[layout.widget]]
# kind = "cpu"
# anchor = "top-right"
# x = 64
# y = 64
#
# [[layout.widget]]
# kind = "network"
# anchor = "top-right"
# x = 64
# y = 190

# Which parts the panel (and the "gpus" and "info" widgets) show. Left
# out, everything this PC has is shown. To hide something, uncomment
# its line; "gpus" lists which GPUs to show (1 = the first).
#
# [panel]
# cpu = false
# network = false
# ram = false
# ssd = false
# gpus = [1]

# The network graph shows the last 30 seconds; `seconds` changes that
# (10 to 300). It turns from green to red as download speed nears your
# network adapter's speed. If your internet plan is slower, give its
# download speed (in Mbit/s) so red means "maxed out":
#
# [network]
# seconds = 30
# max_mbps = 500

# Discord: needs your own Discord application (discord.com/developers):
# its client id and secret from the OAuth2 page, with the redirect
# "http://localhost" added there. The first time, Discord asks you to
# approve Wallflex. Add a widget with kind = "discord" to show it.
#
# [discord]
# client_id = "123456789012345678"
# client_secret = "..."
# # Optional, for who's online and friends: the application's bot token
# # (with the Presence and Server Members intents) and friends' user ids.
# bot_token = "..."
# friends = ["123456789012345678"]

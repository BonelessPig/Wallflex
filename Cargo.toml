[package]
name = "wallflex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight desktop widgets drawn behind the icons"
license = "MIT OR Apache-2.0"
authors = ["Graham Burkett"]
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# Only src/win32 may use unsafe; it opts back in with #![allow(unsafe_code)].
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# The Rust version of the MISRA rules: no unchecked failures, no silent
# lossy casts, no unchecked indexing or overflow.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "deny"

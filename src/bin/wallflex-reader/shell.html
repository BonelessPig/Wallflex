    name.textContent = guide.title;
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = KIND_NAMES[guide.kind] || "";
    item.append(name, kind);
    if (guide.convertible) {
      const convert = document.createElement("span");
      convert.className = "convert";
      convert.setAttribute("role", "button");
      convert.title = "Convert to Markdown with pandoc";
      convert.textContent = "→ MD";
      convert.addEventListener("click", (event) => {
        event.stopPropagation();
        // One at a time: the app converts on a single thread.
        if (document.querySelector(".convert.busy")) return;
        convert.classList.add("busy");
        convert.textContent = "…";
        // The app waits for pandoc, so let the page repaint first.
        setTimeout(() => send({ type: "convert", path: guide.path }), 30);
      });
      item.append(convert);
    }
    item.addEventListener("click", () => choose(index));
    list.append(item);
  });
  const at = shown.findIndex((g) => g.path === current);
  setActive(words.length ? 0 : Math.max(at, 0));
}

function setActive(index) {
  active = shown.length ? Math.min(Math.max(index, 0), shown.length - 1) : -1;
  document.querySelectorAll(".item").forEach((item) => {
    const on = Number(item.dataset.index) === active;
    item.classList.toggle("active", on);
    if (on) item.scrollIntoView({ block: "nearest" });
  });
}

function choose(index) {
  const guide = shown[index];
  if (guide && guide.claude) {
    openClaude(claudeSection);
    return;
  }
  if (guide && guide.web) {
    openWeb(guide.web);
    return;
  }
  closeMenu();
  if (guide && guide.path !== current) open(guide.path);
}

$("radial").addEventListener("mouseenter", () => setFan(true));
$("radial").addEventListener("mouseleave", closeFanSoon);
$("radial").addEventListener("focusin", () => setFan(true));
$("radial").addEventListener("focusout", (event) => {
  if (!$("radial").contains(event.relatedTarget)) setFan(false);
});
// Dragging the dot moves the window (the app takes the mouse from
// there, and unpins a pinned one first); a click without moving opens
// the menu.
const DRAG_START_PX = 4;
let press = null;
let dragged = false;
$("hub").addEventListener("pointerdown", (event) => {
  dragged = false;
  if (event.button !== 0) return;
  // Where in the page it was pressed, in device pixels, so the window
  // keeps the dot under the pointer however late the move starts.
  const ratio = window.devicePixelRatio;
  press = {
    x: event.screenX,
    y: event.screenY,
    at: [Math.round(event.clientX * ratio), Math.round(event.clientY * ratio)],
  };
});
document.addEventListener("pointermove", (event) => {
  if (!press) return;
  if (!(event.buttons & 1)) { press = null; return; }
  const moved = Math.hypot(event.screenX - press.x, event.screenY - press.y);
  if (moved < DRAG_START_PX) return;
  const at = press.at;
  press = null;
  dragged = true;
  setFan(false);
  send({ type: "move", at });
});
document.addEventListener("pointerup", () => { press = null; });
$("hub").addEventListener("click", () => {
  if (dragged) { dragged = false; return; }
  setFan(!$("radial").classList.contains("open"));
});
$("pick").addEventListener("click", () => {
  setFan(false);
  if ($("menu").hidden) openMenu(); else closeMenu();
});
$("filter").addEventListener("input", fillMenu);
$("filter").addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") { setActive(active + 1); event.preventDefault(); }
  if (event.key === "ArrowUp") { setActive(active - 1); event.preventDefault(); }
  if (event.key === "Enter") { choose(active); event.preventDefault(); }
});
$("toc-button").addEventListener("click", () => {
  setFan(false);
  closeSun();
  setTocPinned(!tocPinned);
});
$("toc-button").addEventListener("mouseenter", openSun);
$("toc-button").addEventListener("mouseleave", closeSunSoon);
$("rail-grip").addEventListener("pointerdown", (event) => {
  $("rail-grip").setPointerCapture(event.pointerId);
  $("rail-grip").classList.add("drag");
  document.body.style.userSelect = "none";
  railDrag = true;
  hideTip();
});
$("rail-grip").addEventListener("pointermove", (event) => {
  if (railDrag) dragRail(event.clientX);
});
$("rail-grip").addEventListener("pointerup", () => {
  if (!railDrag) return;
  railDrag = false;
  $("rail-grip").classList.remove("drag");
  document.body.style.userSelect = "";
  send({ type: "rail", width: railWidth || 0 });
});
$("rail-grip").addEventListener("dblclick", () => {
  railWidth = null;
  applyRailWidth();
  send({ type: "rail", width: 0 });
});
$("rail-fold").addEventListener("click", () => foldAll(true));
$("rail-unfold").addEventListener("click", () => foldAll(false));
$("aa").addEventListener("click", () => {
  setFan(false);
  toggleStylePanel($("style").hidden);
});
$("folder").addEventListener("click", () => {
  setFan(false);
  send({ type: "folder" });
});
$("error-dismiss").addEventListener("click", () => {
  $("error").hidden = true;
});
$("open-folder").addEventListener("click", () => send({ type: "folder" }));
$("close").addEventListener("click", () => send({ type: "close" }));
document.addEventListener("mousedown", (event) => {
  if (!$("menu").hidden && !event.target.closest("#menu, #pick")) closeMenu();
  if (!$("style").hidden && !event.target.closest("#style, #aa")) toggleStylePanel(false);
});
function escape() {
  if ($("radial").classList.contains("open")) {
    setFan(false);
    if ($("radial").contains(document.activeElement)) document.activeElement.blur();
  } else if (!$("menu").hidden) closeMenu();
  else if (!$("style").hidden) toggleStylePanel(false);
  else send({ type: "close" });
}

// A click in the guide moves the focus there, and never reaches this
// page: close the panels then too.
window.addEventListener("blur", () => {
  setFan(false);
  closeMenu();
  closeSun();
  toggleStylePanel(false);
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    escape();
    event.preventDefault();
  } else if (event.ctrlKey && (event.key === "k" || event.key === "o")) {
    openMenu();
    event.preventDefault();
  }
});

if (webview) {
  webview.addEventListener("message", (event) => {
    const message = event.data;
    if (message.type === "list") onList(message);
    else if (message.type === "show") onShow(message);
    else if (message.type === "converted") onConverted(message);
    else if (message.type === "web") onWeb(message);
    else if (message.type === "back") goBack();
    else if (message.type === "save") saveWeb();
    else if (message.type === "saved") onSaved(message);
    else if (message.type === "pinned") setPinned(message.pinned);
    else if (message.type === "escape") escape();
  });
}
buildStylePanel();
setCorner(null);
setPinned(false);
send({ type: "ready" });
</script>
</body>
</html>
